services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://user1:12345@db:5432/WeightTracker_DB
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: WeightTracker_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: 
